name: CI Pipeline

# When does this run?
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Quality Checks ───────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'           # caches node_modules between runs (faster)

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci               # ci = clean install, faster & more reliable than npm install

      # 4. Run ESLint
      - name: Run linter
        run: npm run lint

      # 5. TypeScript type checking
      - name: Type check
        run: npm run type-check

  # ─── Job 2: Build Check ───────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality            # only runs if 'quality' job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Optional: upload the build output as an artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1